name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true

jobs:
  publish:
    name: 📦 Publish to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: 🏷️ Update version
        shell: pwsh
        run: |
          $replacement = '"' + "${{ inputs.version }}" + '"'

          $toml = (Get-Content -Path Cargo.toml -Raw) -replace '(?m)(?<=^version = )"[^"]+"', $replacement
          $toml | Set-Content -Path Cargo.toml -NoNewline

          $lock = (Get-Content -Path Cargo.lock -Raw) -replace '(?<=name = "oasreader"\r?\nversion = )"[^"]+"', $replacement
          $lock | Set-Content -Path Cargo.lock -NoNewline

      - name: 🧪 Test
        run: cargo test --locked --all-features

      - name: 📦 Publish
        run: cargo publish --allow-dirty
