[package]
name = "oasreader"
authors = ["Christian Helle"]
version = "0.1.0"
edition = "2024"
description = "Read OpenAPI specifications split across multiple files and merge external references into a single document"
homepage = "https://github.com/christianhelle/oasreader-rs"
license = "MIT"
repository = "https://github.com/christianhelle/oasreader-rs"
rust-version = "1.96"
readme = "README.md"
keywords = ["openapi", "swagger", "parser", "ref", "merge"]
categories = ["parser-implementations", "development-tools"]
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["remote"]
remote = ["dep:ureq"]
typed = ["dep:openapiv3", "dep:openapiv3_1"]

[dependencies]
openapiv3 = { version = "2.2.0", optional = true }
openapiv3_1 = { version = "0.1.5", optional = true }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = { version = "3.4.1", default-features = false, features = ["rustls"], optional = true }
url = "2.5.8"
yaml_serde = "0.10.7"
